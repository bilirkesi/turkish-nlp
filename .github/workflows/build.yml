name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e "packages/ottoman-transliterator[dev]"
        pip install -e "ottoman-agent-pipeline[dev]"
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check packages/ottoman-transliterator ottoman-agent-pipeline
    
    - name: Run tests
      run: |
        pytest packages/ottoman-transliterator/tests -v
        pytest ottoman-agent-pipeline/tests -v
