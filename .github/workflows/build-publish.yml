# GitHub Actions - Build, Test & Publish

name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "packages/ottoman-transliterator[dev]"
    
    - name: Lint with Ruff
      run: |
        ruff check packages/ottoman-transliterator/src
        ruff check packages/ottoman-transliterator/tests
    
    - name: Format check with Black
      run: |
        black --check packages/ottoman-transliterator/src
        black --check packages/ottoman-transliterator/tests
    
    - name: Run tests
      run: |
        pytest packages/ottoman-transliterator/tests/ -v --cov=ottoman_transliterator --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade build twine
    
    - name: Build package
      run: |
        cd packages/ottoman-transliterator
        python -m build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: packages/ottoman-transliterator/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: packages/ottoman-transliterator/dist/
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        cd packages/ottoman-transliterator
        twine upload dist/*
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: packages/ottoman-transliterator/dist/*
        generate_release_notes: true
